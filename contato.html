<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato | Tania</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <p><strong>Tania</strong></p>
        <nav>

            <a href="index.html">Inicio</a>
            <a href="sobre.html">Sobre</a>
            <a href="projeto.html">Projetos</a>
            <a href="contato.html">Contato</a>
        </nav>
    </header>
    <main>
       <h1>Entre em contato comigo!</h1>
       <section class="card">
        <form id="formulario">
        <p>
            <label for="nome">Nome:</label>
            <input type="text" id="nome" name="nome" required>
        </p>
        <p>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>
        </p>
        <p>
            <label for="telefone">Telefone:</label>
            <input type="tel" id="telefone" name="telefone">
        </p>
        <p>
            <label for="assunto">Assunto:</label>
            <select id="assunto" name="assunto">
                <option value="duvida">Orçamento</option>
                <option value="sugestao">Dúvida</option>
                <option value="elogio">Outro</option>
            </select>
        </p>
        <p>
            <label for="mensagem">Mensagem:</label>
            <textarea id="mensagem" name="mensagem" required></textarea>
        </p>
        <p>
            <button type="submit">Enviar</button>
        </p>
       </form>
       <p id="resposta"></p>
       </section>
      <p>Me siga no Instagram e veja meus conteúdos!</p>
       <a href="https://www.instagram.com/daylightamy_wz/">instagram</a>
    </main>
    <footer>
        <p>  <em>©</em> <em>2026</em> <em>Tannie</em></p>
    </footer>
    <script src="js/contato.js"></script>
</body>
</html>
